<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/png" href="/favicon.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/style.css" />
        <title>Lab Maya - EcoShip-MarpolLab</title>
    </head>

    <body>
        <div id="root"></div>
        <div id="orientation-lock">
            <img class="orientation-lock__logo" src="/assets/logo.png" alt="EcoShip-MarpolLab" />

            <svg
                class="orientation-lock__art"
                viewBox="0 0 400 300"
                width="260"
                height="195"
                xmlns="http://www.w3.org/2000/svg"
            >
                <circle cx="200" cy="150" r="140" fill="#ffffff" opacity="0.06" />
                <circle cx="200" cy="150" r="105" fill="#ffffff" opacity="0.08" />

                <rect x="30" y="115" width="34" height="8" rx="4" fill="#bcd4f5" opacity="0.85" transform="rotate(-18 47 119)" />
                <rect x="30" y="175" width="34" height="8" rx="4" fill="#bcd4f5" opacity="0.85" transform="rotate(18 47 179)" />
                <rect x="336" y="115" width="34" height="8" rx="4" fill="#bcd4f5" opacity="0.85" transform="rotate(18 353 119)" />
                <rect x="336" y="175" width="34" height="8" rx="4" fill="#bcd4f5" opacity="0.85" transform="rotate(-18 353 179)" />

                <path d="M 250 55 Q 315 55 330 105" fill="none" stroke="#bcd4f5" stroke-width="10" stroke-linecap="round" />
                <polygon points="345,90 335,118 312,100" fill="#bcd4f5" />

                <path d="M 150 245 Q 85 245 70 195" fill="none" stroke="#bcd4f5" stroke-width="10" stroke-linecap="round" />
                <polygon points="55,210 65,182 88,200" fill="#bcd4f5" />

                <rect x="95" y="88" width="210" height="124" rx="22" fill="#12294f" stroke="#0a1a33" stroke-width="3" />
                <rect x="112" y="103" width="176" height="94" rx="10" fill="url(#orientation-lock-screen)" />
                <rect x="150" y="90" width="18" height="5" rx="2.5" fill="#0a1a33" />
                <rect x="176" y="90" width="18" height="5" rx="2.5" fill="#0a1a33" />
                <rect x="100" y="140" width="4" height="20" rx="2" fill="#0a1a33" />

                <defs>
                    <linearGradient id="orientation-lock-screen" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#eaf3ff" />
                        <stop offset="100%" stop-color="#c7dcf6" />
                    </linearGradient>
                </defs>
            </svg>

            <h1 class="orientation-lock__title">Putar Perangkat Anda</h1>
            <p class="orientation-lock__body">
                EcoShip-MarpolLab hanya dapat digunakan dalam mode landscape (mendatar).<br />
                Silakan putar perangkat Anda untuk melanjutkan pembelajaran.
            </p>
        </div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
